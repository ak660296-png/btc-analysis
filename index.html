<!doctype html>

<html lang="zh-Hant">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>₿ BTC 多空分析 V2.3</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#f3f4f6;

  color:#202124;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",

  "PingFang TC","Noto Sans TC",Arial,sans-serif;

}

.wrap{

  max-width:760px;

  margin:auto;

  padding:14px;

}

.card{

  background:#fff;

  border-radius:20px;

  padding:20px;

  margin-bottom:16px;

  box-shadow:0 3px 14px rgba(0,0,0,.06);

}

h1{

  margin:0 0 6px;

  font-size:30px;

}

h2{

  margin:0 0 14px;

}

h3{

  margin:0 0 14px;

  font-size:21px;

}

.sub{

  color:#6b7280;

  font-size:16px;

}

.price{

  font-size:38px;

  font-weight:800;

  margin-top:20px;

}

.status{

  margin-top:8px;

  color:#666;

}

.status.ok{

  color:#16803c;

}

.status.err{

  color:#c62828;

}

.grid{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

}

.box{

  background:#f7f7f8;

  border-radius:16px;

  padding:15px 12px;

}

.label{

  color:#777;

  font-size:14px;

  margin-bottom:7px;

}

.value{

  font-size:24px;

  font-weight:800;

}

.row{

  display:flex;

  justify-content:space-between;

  gap:15px;

  padding:12px 0;

  border-bottom:1px solid #eee;

}

.row:last-child{

  border-bottom:0;

}

.big{

  font-size:22px;

  font-weight:800;

}

.badge{

  display:inline-block;

  padding:8px 16px;

  border-radius:999px;

  font-weight:800;

  background:#eee;

}

.long{

  background:#d9f7df;

  color:#08752c;

}

.short{

  background:#ffe0e0;

  color:#b42318;

}

.wait{

  background:#eee;

  color:#555;

}

button{

  border:0;

  border-radius:12px;

  padding:12px 16px;

  font-size:16px;

  font-weight:700;

  background:#222;

  color:#fff;

}

button:active{

  transform:scale(.98);

}

input,select{

  width:100%;

  padding:12px;

  margin:6px 0 12px;

  border:1px solid #d5d7da;

  border-radius:10px;

  font-size:16px;

  background:#fff;

}

table{

  width:100%;

  border-collapse:collapse;

  font-size:14px;

}

th,td{

  padding:10px 6px;

  border-bottom:1px solid #eee;

  text-align:left;

}

.note{

  color:#666;

  line-height:1.6;

}

.small{

  font-size:12px;

  color:#777;

}

.errorbox{

  background:#fff0f0;

  color:#a40000;

  border-radius:14px;

  padding:12px;

  margin-top:12px;

}

@media(max-width:520px){

  .wrap{padding:10px}

  .card{padding:16px}

  h1{font-size:27px}

  .price{font-size:32px}

  .grid{gap:7px}

  .box{padding:12px 8px}

  .value{font-size:20px}

}

</style>

</head>

<body>

<div class="wrap">

  <div class="card">

    <h1>₿ BTC 多空分析 V2.3</h1>

    <div class="sub">iPhone 友善版｜15M / 1H / 4H 多週期</div>

    <div id="price" class="price">載入中…</div>

    <div id="updated" class="status">正在連線到 Binance 行情…</div>

    <div id="error" style="display:none" class="errorbox"></div>

  </div>

  <div class="card">

    <div class="grid">

      <div class="box">

        <div class="label">多頭</div>

        <div id="bull" class="value">—</div>

      </div>

      <div class="box">

        <div class="label">空頭</div>

        <div id="bear" class="value">—</div>

      </div>

      <div class="box">

        <div class="label">RSI 1H</div>

        <div id="rsi" class="value">—</div>

      </div>

    </div>

    <div style="margin-top:20px">

      <span style="font-size:19px">綜合判斷：</span>

      <span id="decision" class="badge wait">分析中</span>

    </div>

  </div>

  <div class="card">

    <h3>多週期</h3>

    <div class="row">

      <span>15M</span>

      <b id="tf15">—</b>

    </div>

    <div class="row">

      <span>1H</span>

      <b id="tf1">—</b>

    </div>

    <div class="row">

      <span>4H</span>

      <b id="tf4">—</b>

    </div>

    <div class="row">

      <span>EMA 12 / 26（1H）</span>

      <b id="ema">—</b>

    </div>

    <div class="row">

      <span>MACD（1H）</span>

      <b id="macd">—</b>

    </div>

  </div>

  <div class="card">

    <h3>支撐 / 壓力（近 50 根 1H）</h3>

    <div class="row">

      <span>近期支撐</span>

      <b id="support" class="big">—</b>

    </div>

    <div class="row">

      <span>近期壓力</span>

      <b id="resist" class="big">—</b>

    </div>

  </div>

  <div class="card">

    <h3>分析師喊單驗證</h3>

    <div class="sub">

      資料只保存在這台裝置的瀏覽器。

    </div>

    <label>方向</label>

    <select id="side">

      <option value="LONG">多單</option>

      <option value="SHORT">空單</option>

    </select>

    <label>進場價</label>

    <input id="entry" type="number" inputmode="decimal" placeholder="例如 105000">

    <label>止損</label>

    <input id="sl" type="number" inputmode="decimal" placeholder="例如 103000">

    <label>止盈</label>

    <input id="tp" type="number" inputmode="decimal" placeholder="例如 108000">

    <button onclick="addCall()">新增喊單</button>

    <div style="overflow:auto;margin-top:14px">

      <table>

        <thead>

          <tr>

            <th>方向</th>

            <th>進場</th>

            <th>止損</th>

            <th>止盈</th>

            <th>結果</th>

          </tr>

        </thead>

        <tbody id="calls"></tbody>

      </table>

    </div>

  </div>

  <div class="card">

    <button onclick="load()">🔄 重新取得 BTC 行情</button>

  </div>

  <div class="card">

    <div class="note">

      ⚠️ 技術分析僅供參考，不代表未來一定上漲或下跌。

      <br><br>

      本工具使用 Binance 公開市場資料進行計算。

    </div>

  </div>

</div>

<script>

const API="https://api.binance.com/api/v3";

let data={

  price:null

};

/* =========================

   基本工具

========================= */

function $(id){

  return document.getElementById(id);

}

function fmt(n){

  if(n==null || !isFinite(n)) return "—";

  return "$"+Number(n).toLocaleString(

    "en-US",

    {

      maximumFractionDigits:2

    }

  );

}

function num(n){

  return Number(n).toLocaleString(

    "en-US",

    {

      maximumFractionDigits:2

    }

  );

}

/* =========================

   EMA

========================= */

function ema(a,n){

  if(!a || a.length===0) return null;

  const k=2/(n+1);

  let e=Number(a[0]);

  for(let i=1;i<a.length;i++){

    e=Number(a[i])*k+e*(1-k);

  }

  return e;

}

/* =========================

   RSI

========================= */

function rsi(a,n=14){

  if(!a || a.length<=n) return null;

  let gain=0;

  let loss=0;

  for(let i=1;i<=n;i++){

    const d=a[i]-a[i-1];

    if(d>0) gain+=d;

    else loss-=d;

  }

  gain/=n;

  loss/=n;

  for(let i=n+1;i<a.length;i++){

    const d=a[i]-a[i-1];

    const g=d>0?d:0;

    const l=d<0?-d:0;

    gain=(gain*(n-1)+g)/n;

    loss=(loss*(n-1)+l)/n;

  }

  if(loss===0) return 100;

  const rs=gain/loss;

  return 100-100/(1+rs);

}

/* =========================

   MACD

========================= */

function macd(a){

  if(!a || a.length<30) return null;

  const e12=ema(a,12);

  const e26=ema(a,26);

  return e12-e26;

}

/* =========================

   Binance K線

========================= */

async function candles(interval,limit=100){

  const url=

    API+

    "/klines?symbol=BTCUSDT"+

    "&interval="+interval+

    "&limit="+limit;

  const res=await fetch(url,{

    cache:"no-store"

  });

  if(!res.ok){

    throw new Error(

      "Binance 回應 "+res.status

    );

  }

  const j=await res.json();

  return j.map(x=>({

    o:Number(x[1]),

    h:Number(x[2]),

    l:Number(x[3]),

    c:Number(x[4]),

    v:Number(x[5]),

    t:Number(x[0])

  }));

}

/* =========================

   單週期分析

========================= */

function analyze(a){

  const closes=a.map(x=>x.c);

  const last=a[a.length-1];

  const e12=ema(closes,12);

  const e26=ema(closes,26);

  const R=rsi(closes,14);

  const M=e12-e26;

  let b=0;

  let s=0;

  /* 價格 vs EMA */

  if(last.c>e12) b+=10;

  else s+=10;

  if(last.c>e26) b+=10;

  else s+=10;

  /* RSI */

  if(R>50) b+=10;

  else s+=10;

  if(R>60) b+=10;

  if(R<40) s+=10;

  /* MACD */

  if(M>0) b+=15;

  else s+=15;

  /* 最近趨勢 */

  const recent=closes.slice(-10);

  if(recent.length>=2){

    if(recent[recent.length-1]>recent[0])

      b+=10;

    else

      s+=10;

  }

  return{

    b,

    s,

    R,

    e12,

    e26,

    M

  };

}

/* =========================

   支撐壓力

========================= */

function supportResistance(a){

  const lows=a.slice(-50).map(x=>x.l);

  const highs=a.slice(-50).map(x=>x.h);

  return{

    support:Math.min(...lows),

    resist:Math.max(...highs)

  };

}

/* =========================

   綜合分析

========================= */

function combined(x15,x1,x4){

  const b=Math.round(

    x15.b*.25+

    x1.b*.40+

    x4.b*.35

  );

  const s=Math.round(

    x15.s*.25+

    x1.s*.40+

    x4.s*.35

  );

  return{

    b,

    s

  };

}

/* =========================

   載入行情

========================= */

async function load(){

  const status=$("updated");

  const error=$("error");

  status.className="status";

  status.textContent="正在取得 BTC 行情…";

  error.style.display="none";

  $("price").textContent="載入中…";

  $("bull").textContent="—";

  $("bear").textContent="—";

  $("rsi").textContent="—";

  $("decision").textContent="分析中";

  $("decision").className="badge wait";

  try{

    const [

      a15,

      a1,

      a4

    ]=await Promise.all([

      candles("15m",100),

      candles("1h",100),

      candles("4h",100)

    ]);

    const x15=analyze(a15);

    const x1=analyze(a1);

    const x4=analyze(a4);

    const total=combined(

      x15,

      x1,

      x4

    );

    /* 最新價格 */

    data.price=a1[a1.length-1].c;

    $("price").textContent=

      fmt(data.price);

    /* 更新時間 */

    const now=new Date();

    $("updated").textContent=

      "最後更新："+

      now.toLocaleTimeString("zh-TW");

    $("updated").className="status ok";

    /* 分數 */

    $("bull").textContent=total.b;

    $("bear").textContent=total.s;

    /* RSI */

    $("rsi").textContent=

      x1.R==null

      ?"—"

      :x1.R.toFixed(1);

    /* 多週期 */

    $("tf15").textContent=

      x15.b>x15.s

      ?"偏多"

      :x15.s>x15.b

      ?"偏空"

      :"中性";

    $("tf1").textContent=

      x1.b>x1.s

      ?"偏多"

      :x1.s>x1.b

      ?"偏空"

      :"中性";

    $("tf4").textContent=

      x4.b>x4.s

      ?"偏多"

      :x4.s>x4.b

      ?"偏空"

      :"中性";

    /* EMA */

    $("ema").textContent=

      num(x1.e12)+" / "+num(x1.e26);

    /* MACD */

    $("macd").textContent=

      x1.M>=0

      ?"+"+num(x1.M)

      :num(x1.M);

    /* 綜合判斷 */

    const d=$("decision");

    if(total.b>=70 && total.b>total.s){

      d.textContent="🟢 偏多";

      d.className="badge long";

    }

    else if(total.s>=70 && total.s>total.b){

      d.textContent="🔴 偏空";

      d.className="badge short";

    }

    else{

      d.textContent="🟡 觀望";

      d.className="badge wait";

    }

    /* 支撐壓力 */

    const sr=supportResistance(a1);

    $("support").textContent=

      fmt(sr.support);

    $("resist").textContent=

      fmt(sr.resist);

    /* 更新喊單 */

    renderCalls();

  }catch(e){

    console.error(e);

    status.className="status err";

    status.textContent=

      "行情取得失敗";

    error.style.display="block";

    error.textContent=

      "❌ 無法取得即時行情："+e.message;

    $("price").textContent=

      "暫時無法取得";

    $("decision").textContent=

      "等待行情";

    $("decision").className=

      "badge wait";

  }

}

/* =========================

   喊單儲存

========================= */

function getCalls(){

  try{

    return JSON.parse(

      localStorage.getItem("btcCalls")||"[]"

    );

  }catch(e){

    return [];

  }

}

function saveCalls(arr){

  localStorage.setItem(

    "btcCalls",

    JSON.stringify(arr)

  );

}

/* =========================

   新增喊單

========================= */

function addCall(){

  const side=$("side").value;

  const entry=Number($("entry").value);

  const sl=Number($("sl").value);

  const tp=Number($("tp").value);

  if(

    !entry ||

    !sl ||

    !tp

  ){

    alert("請完整填寫進場、止損、止盈");

    return;

  }

  const arr=getCalls();

  arr.unshift({

    id:Date.now(),

    side,

    entry,

    sl,

    tp,

    time:new Date().toLocaleString("zh-TW")

  });

  saveCalls(arr);

  $("entry").value="";

  $("sl").value="";

  $("tp").value="";

  renderCalls();

}

/* =========================

   判斷喊單結果

========================= */

function result(x){

  if(data.price==null)

    return "待定";

  const p=data.price;

  if(x.side==="LONG"){

    if(p<=x.sl)

      return "❌ 止損";

    if(p>=x.tp)

      return "✅ 止盈";

  }

  else{

    if(p>=x.sl)

      return "❌ 止損";

    if(p<=x.tp)

      return "✅ 止盈";

  }

  return "⏳ 持倉中";

}

/* =========================

   顯示喊單

========================= */

function renderCalls(){

  const arr=getCalls();

  const tbody=$("calls");

  if(!arr.length){

    tbody.innerHTML=

      '<tr><td colspan="5" class="small">尚無喊單</td></tr>';

    return;

  }

  tbody.innerHTML=arr.map(x=>{

    return `

      <tr>

        <td>${x.side==="LONG"?"多":"空"}</td>

        <td>${num(x.entry)}</td>

        <td>${num(x.sl)}</td>

        <td>${num(x.tp)}</td>

        <td>${result(x)}</td>

      </tr>

    `;

  }).join("");

}

/* =========================

   啟動

========================= */

renderCalls();

load();

/* =========================

   每 60 秒更新

========================= */

setInterval(

  load,

  60000

);

</script>

</body>

</html>
